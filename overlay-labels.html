<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship Labels (AIS-anchored) — Mackinac Tracker</title>
<style>
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:'Segoe UI',system-ui,sans-serif; user-select:none; }
  #stage,#anchors { position:fixed; inset:0; }
  #anchors { pointer-events:none; }
  /* ship labels */
  /* label sits just BELOW the vessel (on the water) so it never covers the ship */
  .lbl { position:absolute; transform:translate(-50%,14px); white-space:nowrap; pointer-events:none;
    background:rgba(8,14,22,.82); color:#eaf2fb; border:1px solid rgba(120,180,255,.55);
    border-radius:8px; padding:3px 9px; font-size:15px; font-weight:600; line-height:1.15;
    box-shadow:0 3px 10px rgba(0,0,0,.45); }
  .lbl .sub { display:block; font-size:11px; font-weight:400; color:#9fc0e6; }
  .lbl::after { content:''; position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    border:5px solid transparent; border-bottom-color:rgba(120,180,255,.55); }
  .lbl.test { background:rgba(46,8,34,.86); border-color:#ff6ad5; color:#ffd9f2; }
  .lbl.test::after { border-top-color:#ff6ad5; }
  .chk { position:absolute; transform:translate(-50%,-50%); pointer-events:none; color:#57e6ff;
    font-weight:700; font-size:13px; text-shadow:0 0 4px #000,0 0 4px #000; white-space:nowrap; }
  /* draggable calibration anchors */
  .anch { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:grab;
    color:#ffd23f; text-align:center; touch-action:none; }
  .anch .dia { display:block; font-size:22px; line-height:1; text-shadow:0 0 5px #000,0 0 5px #000,0 0 5px #000; }
  .anch .atag { display:block; font-size:11px; font-weight:700; margin-top:1px; color:#ffe27a;
    text-shadow:0 0 4px #000,0 0 4px #000; white-space:nowrap; }
  .anch .hit { position:absolute; left:50%; top:50%; width:40px; height:40px; transform:translate(-50%,-50%); }
  .anch.shipa .dia { color:#57e6ff; }
  .anch.shipa .atag { color:#9defff; }
  .anch.sel .dia { color:#39ff14; text-shadow:0 0 6px #000,0 0 8px #39ff14; }
  .anch.sel .atag { color:#9dff7a; }
  #cross { position:fixed; left:50%; top:50%; width:24px; height:24px; transform:translate(-50%,-50%);
    pointer-events:none; opacity:.5; z-index:5; }
  #cross:before,#cross:after { content:''; position:absolute; background:#ff5; }
  #cross:before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #cross:after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  /* calibration panel */
  #cal { position:fixed; top:12px; left:12px; width:340px; z-index:9; background:rgba(10,16,26,.95);
    color:#dbe7f5; border:1px solid #2a3648; border-radius:12px; padding:14px 16px; font-size:14px; }
  #cal h3 { margin:0 0 4px; font-size:16px; }
  #cal .desc { color:#8fa6bd; font-size:11.5px; line-height:1.45; margin-bottom:10px; }
  #cal .arow { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:7px; cursor:pointer; }
  #cal .arow:hover { background:rgba(120,180,255,.08); }
  #cal .arow.sel { background:rgba(57,255,20,.14); outline:1px solid rgba(57,255,20,.4); }
  #cal .arow input { width:16px; height:16px; }
  #cal .arow .nm { flex:1; }
  #cal .arow .rz { color:#8fa6bd; font-size:11px; font-variant-numeric:tabular-nums; }
  #pad { margin:10px 0 6px; height:96px; border-radius:10px; cursor:crosshair;
    background:repeating-linear-gradient(0deg,#0d1622,#0d1622 11px,#111d2c 11px,#111d2c 12px),
               repeating-linear-gradient(90deg,#0d1622,#0d1622 11px,#111d2c 11px,#111d2c 12px);
    border:1px solid #33445c; display:flex; align-items:center; justify-content:center;
    color:#6f88a1; font-size:11.5px; text-align:center; }
  #cal .out { font-size:11.5px; color:#a8bdd4; margin-top:8px; line-height:1.5; font-variant-numeric:tabular-nums; }
  #cal .out b { color:#7fd0ff; }
  #cal .btns { display:flex; gap:8px; margin-top:10px; }
  #cal button { flex:1; border:0; border-radius:8px; padding:8px 10px; font-weight:700; font-size:13px; cursor:pointer; }
  #copyCal { background:#2a6cff; color:#fff; }
  #resetPos { background:#31405a; color:#cfe0f2; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="anchors"></div>
<script>
// ── Fixed camera location (the roof cam) ─────────────────────────
var CAM = { lat: 45.78712606267091, lon: -84.72825497388841 };
var MAX_LABEL_MI = 12;
var CAL_MODE = /[?&]cal=1/.test(location.search);
var TEST_MODE = /[?&]test=1/.test(location.search);
var TOWER_H = 168;   // metres above water (552 ft main tower)

// ── Synthetic test targets (?test=1) — verify projection without a real ship ─
// Ghost ship glides E-W along the channel through the main-span midpoint (water level).
var TEST_PATH  = { lat:45.81535, lon0:-84.72794, lonAmp:0.014, period:50 };
// Held-out landmarks NOT used in the tower calibration — if these ✛ land on the
// real piers, the calibration generalises across the whole frame.
var TEST_CHECK = [
  { label:'S pier ✓', lat:45.80527, lon:-84.72945 },
  { label:'N pier ✓', lat:45.82543, lon:-84.72643 }
];

// ── Preset gate: on the clean overlay, show labels ONLY while the camera is at the
// calibrated 'bridge' preset. The server broadcasts the live PTZ zone over the WS.
// Bypassed in cal/test/always modes so you can tune any time.
var GATE = !(CAL_MODE || TEST_MODE || /[?&]always=1/.test(location.search));
var ptzZone = 'home', ptzSeenAt = 0, bridgeEnteredAt = 0;
var SETTLE_MS = 4000;   // let the camera physically arrive before showing labels
var STALE_MS  = 45000;  // if the server/HA goes quiet this long, assume off-preset
function onPtzZone(zone){
  ptzSeenAt = Date.now();
  if (zone === 'bridge' && ptzZone !== 'bridge') bridgeEnteredAt = ptzSeenAt;
  ptzZone = zone || 'home';
}
function gateOpen(){
  if (!GATE) return true;
  if (ptzZone !== 'bridge') return false;
  if (Date.now() - ptzSeenAt > STALE_MS) return false;
  return (Date.now() - bridgeEnteredAt) >= SETTLE_MS;
}

// ── Bridge reference anchors (precise OSM-derived coords) ────────
// h = height above water in metres. Place base anchors at the waterline,
// top anchors at the tower crown.
var ANCHORS = [
  { id:'scb', label:'S pier (waterline)',  lat:45.80527, lon:-84.72945, h:0,       on:false },
  { id:'stb', label:'S tower base',        lat:45.81016, lon:-84.72872, h:0,       on:true  },
  { id:'stt', label:'S tower TOP',         lat:45.81016, lon:-84.72872, h:TOWER_H, on:true  },
  { id:'ntb', label:'N tower base',        lat:45.82053, lon:-84.72717, h:0,       on:true  },
  { id:'ntt', label:'N tower TOP',         lat:45.82053, lon:-84.72717, h:TOWER_H, on:true  },
  { id:'ncb', label:'N pier (waterline)',  lat:45.82543, lon:-84.72643, h:0,       on:false }
];

// ── Calibration state (solved from anchors; seed gets markers close) ─
var SEED = { bearing:-1.812, elev:1.946, hfov:16.655, height:12 };  // solved from bridge-tower calibration (locked preset)
var cal = Object.assign({}, SEED);
var store = load();
if (store.cal) cal = Object.assign({}, SEED, store.cal);
function load(){ try { return JSON.parse(localStorage.getItem('labelCalV2')||'{}'); } catch(e){ return {}; } }
function save(){ try {
  var pos = {}; ANCHORS.forEach(function(a){ if(a.pos) pos[a.id]={x:a.pos.x,y:a.pos.y}; });
  var on = {}; ANCHORS.forEach(function(a){ on[a.id]=a.on; });
  localStorage.setItem('labelCalV2', JSON.stringify({ cal:cal, pos:pos, on:on }));
} catch(e){} }
// restore saved anchor positions / enabled flags
ANCHORS.forEach(function(a){
  if (store.pos && store.pos[a.id]) a.pos = { x:store.pos[a.id].x, y:store.pos[a.id].y };
  if (store.on && a.id in store.on) a.on = store.on[a.id];
});

// ── Live vessels from the server WebSocket ───────────────────────
var ships = {};
var RENDER = 'mackinac-ship-tracker.onrender.com';
var isLocal = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var WS_URL = isLocal ? 'ws://localhost:' + (location.port || 3000) : 'wss://' + RENDER;
function connect(){
  var ws = new WebSocket(WS_URL);
  ws.onmessage = function(ev){ try {
    var m = JSON.parse(ev.data);
    if (m.type === 'ptz_zone') { onPtzZone(m.zone); return; }
    if (m.type === 'ship_data' && m.data && m.data.MessageType === 'PositionReport' && m.data.Message && m.data.Message.PositionReport) {
      var p = m.data.Message.PositionReport, meta = m.data.MetaData || {};
      if (typeof p.Latitude !== 'number' || typeof p.Longitude !== 'number') return;
      ships[meta.MMSI] = { name:(meta.ShipName||'Unknown').trim(), lat:p.Latitude, lon:p.Longitude,
        speed:p.Sog||0, course:p.Cog||0, at:Date.now() };
    }
  } catch(e){} };
  ws.onclose = function(){ setTimeout(connect, 3000); };
  ws.onerror = function(){ try{ws.close();}catch(e){} };
}
connect();

// ── Geometry ─────────────────────────────────────────────────────
function worldGeom(lat, lon){
  var R = 111320;
  var dx = (lon - CAM.lon) * Math.cos(CAM.lat*Math.PI/180) * R;
  var dy = (lat - CAM.lat) * R;
  return { dx:dx, dy:dy, dist:Math.sqrt(dx*dx+dy*dy), brg:Math.atan2(dx, dy)*180/Math.PI };
}
function project(lat, lon, hTarget, W, H){
  var g = worldGeom(lat, lon);
  var elev = Math.atan2((hTarget||0) - cal.height, g.dist) * 180/Math.PI;
  var dAz = ((g.brg - cal.bearing + 540) % 360) - 180;
  var dEl = elev - cal.elev;
  var vfov = cal.hfov * H / W;
  return { x: W/2 + (dAz/(cal.hfov/2))*(W/2), y: H/2 - (dEl/(vfov/2))*(H/2),
    inView: Math.abs(dAz) <= cal.hfov/2 && Math.abs(dEl) <= vfov/2, dist:g.dist };
}
function deadReckon(s){
  var dt = (Date.now() - s.at)/1000; if (dt <= 0 || !s.speed) return { lat:s.lat, lon:s.lon };
  var mps = s.speed*0.514444, dist = mps*dt, rad = s.course*Math.PI/180, R = 111320;
  return { lat: s.lat + (dist*Math.cos(rad))/R, lon: s.lon + (dist*Math.sin(rad))/(R*Math.cos(s.lat*Math.PI/180)) };
}

// ── Solve calibration from placed, enabled anchors ───────────────
function solve(){
  var W = innerWidth, H = innerHeight;
  var pts = ANCHORS.filter(function(a){ return a.on && a.pos; });
  if (pts.length < 2) return;
  // horizontal least-squares:  x = A*brg + B
  var n = pts.length, Sb=0, Sx=0, Sbb=0, Sbx=0;
  pts.forEach(function(a){ var g = worldGeom(a.lat, a.lon); a._brg = g.brg; a._dist = g.dist;
    Sb+=g.brg; Sx+=a.pos.x; Sbb+=g.brg*g.brg; Sbx+=g.brg*a.pos.x; });
  var den = n*Sbb - Sb*Sb;
  if (Math.abs(den) < 1e-9) return;
  var A = (n*Sbx - Sb*Sx)/den, B = (Sx - A*Sb)/n;
  if (A <= 0) return;
  var hfov = W/A, bearing = (W/2 - B)/A;
  if (!(hfov > 1 && hfov < 80)) return;
  var vfov = hfov*H/W, height = 12;
  // vertical: average camera-centre elevation implied by each anchor
  var eSum = 0;
  pts.forEach(function(a){ var el = Math.atan2(a.h - height, a._dist)*180/Math.PI;
    eSum += el - (vfov/2)*(1 - 2*a.pos.y/H); });
  cal = { bearing:bearing, elev:eSum/n, hfov:hfov, height:height };
  save();
}

// ── Render ships ─────────────────────────────────────────────────
var stage = document.getElementById('stage');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function render(){
  var W = innerWidth, H = innerHeight, now = Date.now(), html = '';
  if (!gateOpen()) { stage.innerHTML = ''; requestAnimationFrame(render); return; }
  Object.keys(ships).forEach(function(mmsi){
    var s = ships[mmsi];
    if (now - s.at > 60000) { delete ships[mmsi]; return; }
    var dr = deadReckon(s), pr = project(dr.lat, dr.lon, 0, W, H);
    if (pr.dist > MAX_LABEL_MI*1609.34 || !pr.inView) return;
    var miles = (pr.dist/1609.34).toFixed(1);
    html += '<div class="lbl" style="left:'+pr.x.toFixed(0)+'px;top:'+pr.y.toFixed(0)+'px">'+esc(s.name)+'<span class="sub">'+miles+' mi</span></div>';
  });
  if (TEST_MODE){
    var t = (performance.now()/1000 % TEST_PATH.period)/TEST_PATH.period;
    var glon = TEST_PATH.lon0 + TEST_PATH.lonAmp*Math.sin(2*Math.PI*t);
    var gp = project(TEST_PATH.lat, glon, 0, W, H);
    if (gp.inView) html += '<div class="lbl test" style="left:'+gp.x.toFixed(0)+'px;top:'+gp.y.toFixed(0)+'px">🚢 TEST SHIP<span class="sub">'+(gp.dist/1609.34).toFixed(1)+' mi · simulated</span></div>';
    TEST_CHECK.forEach(function(c){ var p = project(c.lat, c.lon, 0, W, H); if (!p.inView) return;
      html += '<div class="chk" style="left:'+p.x.toFixed(0)+'px;top:'+p.y.toFixed(0)+'px">✛ '+esc(c.label)+'</div>'; });
  }
  stage.innerHTML = html;
  requestAnimationFrame(render);
}
render();

// ── Calibration UI (only with ?cal=1) ────────────────────────────
if (CAL_MODE) {
  document.body.insertAdjacentHTML('beforeend', '<div id="cross"></div>');
  // seed initial anchor positions for any that have none
  ANCHORS.forEach(function(a){ if (!a.pos){ var p = project(a.lat, a.lon, a.h, innerWidth, innerHeight); a.pos = { x:p.x, y:p.y }; } });

  var wrap = document.getElementById('anchors');
  var els = {};
  function makeAnchorEl(a){
    var el = document.createElement('div'); el.className = 'anch' + (a.ship ? ' shipa' : ''); el.dataset.id = a.id;
    el.innerHTML = '<span class="hit"></span><span class="dia">'+(a.ship?'✚':'◆')+'</span><span class="atag">'+esc(a.label)+'</span>';
    wrap.appendChild(el); els[a.id] = el;
    el.addEventListener('mousedown', function(e){ startDrag(a, e); });
    return el;
  }
  ANCHORS.forEach(makeAnchorEl);

  var sel = null, drag = null;
  function selectAnchor(a){ sel = a; syncPanel(); positionAnchors(); }
  function startDrag(a, e){
    if (!a.on) return;
    selectAnchor(a);
    drag = { a:a, ox:e.clientX - a.pos.x, oy:e.clientY - a.pos.y };
    e.preventDefault();
  }
  document.addEventListener('mousemove', function(e){
    if (drag){ drag.a.pos.x = e.clientX - drag.ox; drag.a.pos.y = e.clientY - drag.oy; onMove(); }
  });
  document.addEventListener('mouseup', function(){ drag = null; });

  function positionAnchors(){
    ANCHORS.forEach(function(a){
      var el = els[a.id];
      el.style.display = a.on ? 'block' : 'none';
      if (!a.on) return;
      el.style.left = a.pos.x + 'px'; el.style.top = a.pos.y + 'px';
      el.classList.toggle('sel', sel === a);
    });
  }
  function onMove(){ solve(); positionAnchors(); updateOut(); }

  // fine "trackpad" — drag inside to nudge the selected anchor at reduced gain
  var GAIN = 0.15, pad = null;
  function padDown(e){ if (!sel) return; pad = { x:e.clientX, y:e.clientY }; e.preventDefault(); }
  function padMove(e){ if (!pad || !sel) return;
    sel.pos.x += (e.clientX - pad.x)*GAIN; sel.pos.y += (e.clientY - pad.y)*GAIN;
    pad.x = e.clientX; pad.y = e.clientY; onMove(); }
  document.addEventListener('mousemove', padMove);
  document.addEventListener('mouseup', function(){ pad = null; });

  // arrow-key nudge for the selected anchor
  document.addEventListener('keydown', function(e){
    if (!sel) return;
    var step = e.shiftKey ? 8 : 1, d = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[e.key];
    if (!d) return;
    sel.pos.x += d[0]*step; sel.pos.y += d[1]*step; onMove(); e.preventDefault();
  });

  // panel
  var panel = document.createElement('div'); panel.id = 'cal';
  panel.innerHTML =
    '<h3>🎯 Bridge calibration</h3>' +
    '<div class="desc">Drag each ◆ onto its real point on the bridge (tower TOP = crown, base = where it meets the water). Enable only the ones you can place exactly. Select one, then use the <b>fine pad</b> below or the <b>arrow keys</b> (Shift = faster) for precision. It solves automatically.<br><b>Shift-click a ship</b> in the video to pin it as a ✚ anchor — best for tightening the frame edges (Del removes the selected one).</div>' +
    '<div id="alist"></div>' +
    '<div id="pad">drag here to fine-nudge the selected ◆<br>(arrow keys work too)</div>' +
    '<div class="out" id="out"></div>' +
    '<div class="btns"><button id="copyCal">📋 Copy values</button><button id="resetPos">↺ Reset dots</button></div>';
  document.body.appendChild(panel);

  var alist = document.getElementById('alist');
  function addRow(a){
    var row = document.createElement('div'); row.className = 'arow'; row.dataset.id = a.id;
    row.innerHTML = '<input type="checkbox" '+(a.on?'checked':'')+'><span class="nm">'+esc(a.label)+'</span><span class="rz"></span>';
    alist.appendChild(row);
    row.querySelector('input').addEventListener('change', function(e){
      a.on = e.target.checked;
      if (a.on && !a.pos){ var p = project(a.lat,a.lon,a.h,innerWidth,innerHeight); a.pos={x:p.x,y:p.y}; }
      onMove(); syncPanel(); e.stopPropagation();
    });
    row.addEventListener('click', function(){ if (a.on) selectAnchor(a); });
  }
  ANCHORS.forEach(addRow);
  document.getElementById('pad').addEventListener('mousedown', padDown);
  document.getElementById('copyCal').addEventListener('click', function(){
    var t = JSON.stringify({ bearing:+cal.bearing.toFixed(3), elev:+cal.elev.toFixed(3), hfov:+cal.hfov.toFixed(3), height:cal.height });
    try{ navigator.clipboard.writeText(t); }catch(e){} this.textContent = '✓ copied';
    var self = this; setTimeout(function(){ self.textContent = '📋 Copy values'; }, 1500);
  });
  document.getElementById('resetPos').addEventListener('click', function(){
    ANCHORS.forEach(function(a){ var p = project(a.lat,a.lon,a.h,innerWidth,innerHeight); a.pos={x:p.x,y:p.y}; });
    onMove();
  });

  function syncPanel(){
    ANCHORS.forEach(function(a){
      var row = alist.querySelector('.arow[data-id="'+a.id+'"]');
      if (row){ row.classList.toggle('sel', sel===a); row.querySelector('input').checked = a.on; }
    });
  }
  function updateOut(){
    var W=innerWidth,H=innerHeight, pts=ANCHORS.filter(function(a){return a.on&&a.pos;});
    var sumSq=0, k=0;
    ANCHORS.forEach(function(a){
      var row = alist.querySelector('.arow[data-id="'+a.id+'"]'); if(!row) return;
      if (a.on && a.pos){ var p=project(a.lat,a.lon,a.h,W,H); var dx=p.x-a.pos.x, dy=p.y-a.pos.y, r=Math.sqrt(dx*dx+dy*dy);
        row.querySelector('.rz').textContent = r.toFixed(0)+'px'; sumSq+=r*r; k++; }
      else row.querySelector('.rz').textContent = '';
    });
    var rms = k ? Math.sqrt(sumSq/k) : 0;
    document.getElementById('out').innerHTML =
      'bearing <b>'+cal.bearing.toFixed(2)+'°</b> · fov <b>'+cal.hfov.toFixed(2)+'°</b><br>'+
      'tilt <b>'+cal.elev.toFixed(2)+'°</b> · height <b>'+cal.height+' m</b><br>'+
      'fit error <b>'+rms.toFixed(1)+' px</b> over '+pts.length+' anchors';
  }

  // Shift+click the video to pin the nearest live ship as a calibration anchor
  document.addEventListener('mousedown', function(e){
    if (!e.shiftKey || (e.target.closest && (e.target.closest('.anch') || e.target.closest('#cal')))) return;
    var W=innerWidth, H=innerHeight, best=null, bestD=1e9;
    Object.keys(ships).forEach(function(mmsi){
      var s=ships[mmsi], dr=deadReckon(s), pr=project(dr.lat,dr.lon,0,W,H), d=Math.sqrt((pr.x-e.clientX)*(pr.x-e.clientX)+(pr.y-e.clientY)*(pr.y-e.clientY));
      if (d<bestD){ bestD=d; best={ s:s, dr:dr, mmsi:mmsi }; }
    });
    if (!best) return;
    var a = { id:'ship_'+best.mmsi+'_'+Date.now(), label:((best.s.name||'ship').slice(0,16))+' ✚',
      lat:best.dr.lat, lon:best.dr.lon, h:0, on:true, ship:true, pos:{ x:e.clientX, y:e.clientY } };
    ANCHORS.push(a); makeAnchorEl(a); addRow(a); selectAnchor(a); onMove(); e.preventDefault();
  });
  // Delete / Backspace removes the selected captured ship anchor
  document.addEventListener('keydown', function(e){
    if (!sel || !sel.ship || (e.key !== 'Delete' && e.key !== 'Backspace')) return;
    var i = ANCHORS.indexOf(sel); if (i >= 0) ANCHORS.splice(i, 1);
    if (els[sel.id]) { els[sel.id].remove(); delete els[sel.id]; }
    var row = alist.querySelector('.arow[data-id="'+sel.id+'"]'); if (row) row.remove();
    sel = null; onMove(); e.preventDefault();
  });

  solve(); positionAnchors(); syncPanel(); updateOut();
}
</script>
</body>
</html>
