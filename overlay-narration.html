<html>
<head>
<meta charset="utf-8">
<title>Mackinac — Vessel Narration (audio only)</title>
<style> html, body { margin: 0; background: transparent; overflow: hidden; } </style>
</head>
<body>
<script>
// Audio-only vessel-narration player. Add this as its OWN browser source in OBS
// (any size — it renders nothing visible). It connects to the server, listens for
// `narrate` events, and plays the clip; OBS captures THIS source's audio onto the
// stream. Keeps banner3 completely silent.
var RENDER_URL = 'mackinac-ship-tracker.onrender.com';
var isLocal    = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var WS_URL     = isLocal ? 'ws://localhost:' + (location.port || 3000) : 'wss://' + RENDER_URL;
var HTTP_BASE  = isLocal ? 'http://localhost:' + (location.port || 3000) : 'https://' + RENDER_URL;

var ws = null, reconnectTimer = null, reconnectAttempts = 0;
var queue = [], audio = null, playing = false;
var played = [];   // keys of clips already queued (live event + catch-up can both deliver the same one)

// Queue clips so two narrations never overlap.
var lastNarrateAt = 0, lastNarrateName = null, lastPlayedAt = 0, lastPlayError = null;   // for the heartbeat
function enqueue(d) {
  if (!d || !d.url) return;
  var key = d.mmsi + '@' + (d.at || d.url);
  if (played.indexOf(key) !== -1) return;   // a repeat (live + catch-up) must not look like a new, unplayed clip
  played.push(key); if (played.length > 50) played.shift();
  lastNarrateAt = Date.now(); lastNarrateName = d.name || null;
  queue.push(d); playNext();
}
// On every (re)connect, play anything the server narrated in the last ~90 s that we missed while
// disconnected (server restart/deploy, network blip) — late is better than never during a pass.
function catchUp() {
  fetch(HTTP_BASE + '/api/narrations/pending', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (list) { (list || []).forEach(enqueue); })
    .catch(function () {});
}
function playNext() {
  if (playing || !queue.length) return;
  var d = queue.shift();
  playing = true;
  if (!audio) {
    audio = new Audio();
    audio.addEventListener('ended', function () { playing = false; playNext(); });
    audio.addEventListener('playing', function () { lastPlayedAt = Date.now(); lastPlayError = null; });
    audio.addEventListener('error', function () { lastPlayError = 'audio error ' + (audio.error ? audio.error.code : ''); playing = false; playNext(); });
  }
  audio.src = HTTP_BASE + d.url;
  var p = audio.play();
  if (p && p.catch) p.catch(function (err) { lastPlayError = String((err && (err.name + ': ' + err.message)) || 'play failed').slice(0, 120); playing = false; playNext(); });
}

function connect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  lastMsgAt = Date.now();
  ws = new WebSocket(WS_URL);
  ws.onopen = function () { reconnectAttempts = 0; catchUp(); };   // reset backoff, or every later reconnect waits 30 s
  ws.onmessage = function (e) {
    lastMsgAt = Date.now();
    try { var m = JSON.parse(e.data); noteWsMsg(m.type === 'ship_data'); if (m.type === 'narrate') enqueue(m.data); } catch (ex) {}
  };
  ws.onerror = function () {};
  ws.onclose = function () {
    reconnectAttempts++;
    var delay = Math.min(2000 * Math.pow(2, reconnectAttempts - 1), 30000);
    reconnectTimer = setTimeout(connect, delay);
  };
}

// A dropped network can leave the socket looking open while nothing arrives, and onclose never fires
// (Nov 7 2026: the banner showed "No ships" all night on both OBS). Ship data comes several times a
// minute, so 2 minutes of silence means the link is dead: drop it and connect again.
var lastMsgAt = Date.now(), SILENT_MS = 120000;
setInterval(function () {
  if (!ws || ws.readyState > 1 || Date.now() - lastMsgAt < SILENT_MS) return;
  var dead = ws; ws = null;
  dead.onopen = dead.onmessage = dead.onerror = dead.onclose = null;
  try { dead.close(); } catch (ex) {}
  console.log('No messages for ' + Math.round((Date.now() - lastMsgAt) / 1000) + ' s: reconnecting');
  connect();
}, 30000);
// Health report for the streaming PC's guardian, every 60 s: is this page still hearing ships? (it refreshes
// the OBS source when a page goes blind). Sent as text/plain so it never needs a CORS preflight.
var PAGE_ID = Math.random().toString(36).slice(2, 12), PAGE_LOADED_AT = Date.now(), lastAnyMsgAt = 0, lastShipMsgAt = 0, shipMsgTimes = [], heroName = null;
function noteWsMsg(isShip) {
  var now = Date.now(); lastAnyMsgAt = now;
  if (!isShip) return;
  lastShipMsgAt = now; shipMsgTimes.push(now);
  if (shipMsgTimes.length > 5000) shipMsgTimes.shift();
}
function sendHeartbeat() {
  var now = Date.now(), ago = function (t) { return t ? Math.round((now - t) / 1000) : null; };
  while (shipMsgTimes.length && shipMsgTimes[0] < now - 120000) shipMsgTimes.shift();
  var beat = { id: PAGE_ID, page: 'narration', loadedAt: PAGE_LOADED_AT, wsOpen: !!(ws && ws.readyState === 1),
               lastMsgAgeS: ago(lastAnyMsgAt), lastShipMsgAgeS: ago(lastShipMsgAt), shipMsgs2m: shipMsgTimes.length,
               lastNarrateAt: lastNarrateAt || null, lastNarrateName: lastNarrateName, lastPlayedAt: lastPlayedAt || null, lastPlayError: lastPlayError };
  try { fetch(HTTP_BASE + '/api/overlay-heartbeat', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' },
                                                     body: JSON.stringify(beat) }).catch(function () {}); } catch (ex) {}
}
setTimeout(function () { sendHeartbeat(); setInterval(sendHeartbeat, 60000); }, 20000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && (!ws || ws.readyState === WebSocket.CLOSED)) connect();
});
connect();
</script>
</body>
</html>
