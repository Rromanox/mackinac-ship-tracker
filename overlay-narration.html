<html>
<head>
<meta charset="utf-8">
<title>Mackinac — Vessel Narration (audio only)</title>
<style> html, body { margin: 0; background: transparent; overflow: hidden; } </style>
</head>
<body>
<script>
// Audio-only vessel-narration player. Add this as its OWN browser source in OBS
// (any size — it renders nothing visible). It connects to the server, listens for
// `narrate` events, and plays the clip; OBS captures THIS source's audio onto the
// stream. Keeps banner3 completely silent.
var RENDER_URL = 'mackinac-ship-tracker.onrender.com';
var isLocal    = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var WS_URL     = isLocal ? 'ws://localhost:' + (location.port || 3000) : 'wss://' + RENDER_URL;
var HTTP_BASE  = isLocal ? 'http://localhost:' + (location.port || 3000) : 'https://' + RENDER_URL;

var ws = null, reconnectTimer = null, reconnectAttempts = 0;
var queue = [], audio = null, playing = false;
var played = [];   // keys of clips already queued (live event + catch-up can both deliver the same one)

// Queue clips so two narrations never overlap.
function enqueue(d) {
  if (!d || !d.url) return;
  var key = d.mmsi + '@' + (d.at || d.url);
  if (played.indexOf(key) !== -1) return;
  played.push(key); if (played.length > 50) played.shift();
  queue.push(d); playNext();
}
// On every (re)connect, play anything the server narrated in the last ~90 s that we missed while
// disconnected (server restart/deploy, network blip) — late is better than never during a pass.
function catchUp() {
  fetch(HTTP_BASE + '/api/narrations/pending', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (list) { (list || []).forEach(enqueue); })
    .catch(function () {});
}
function playNext() {
  if (playing || !queue.length) return;
  var d = queue.shift();
  playing = true;
  if (!audio) {
    audio = new Audio();
    audio.addEventListener('ended', function () { playing = false; playNext(); });
    audio.addEventListener('error', function () { playing = false; playNext(); });
  }
  audio.src = HTTP_BASE + d.url;
  var p = audio.play();
  if (p && p.catch) p.catch(function () { playing = false; playNext(); });
}

function connect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  ws = new WebSocket(WS_URL);
  ws.onopen = function () { reconnectAttempts = 0; catchUp(); };   // reset backoff, or every later reconnect waits 30 s
  ws.onmessage = function (e) {
    try { var m = JSON.parse(e.data); if (m.type === 'narrate') enqueue(m.data); } catch (ex) {}
  };
  ws.onerror = function () {};
  ws.onclose = function () {
    reconnectAttempts++;
    var delay = Math.min(2000 * Math.pow(2, reconnectAttempts - 1), 30000);
    reconnectTimer = setTimeout(connect, delay);
  };
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && (!ws || ws.readyState === WebSocket.CLOSED)) connect();
});
connect();
</script>
</body>
</html>
